---
# tasks file for labgrid provisioning as labgrid-exporter
- name: Install required system packages for Labgrid
  become: true
  ansible.builtin.apt:
    pkg:
      - python3-venv
      - python3-pip
      - ser2net
      - microcom
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Ensure /opt/labgrid-venv directory exists and is owned by pi
  become: true
  ansible.builtin.file:
    path: /opt/labgrid-venv
    state: directory
    owner: pi
    group: pi
    mode: '0755'

- name: Initialize venv and install base build tools
  ansible.builtin.pip:
    name:
      - pip
      - setuptools
      - wheel
    state: latest
    virtualenv: /opt/labgrid-venv
    virtualenv_command: python3 -m venv

- name: Copy local labgrid sources to /tmp/labgrid on RPi
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/"
    dest: /tmp/labgrid/
    delete: true
    rsync_opts:
      - "--exclude=.git"

- name: Install local labgrid into /opt/labgrid-venv
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: "26.0.0"
  ansible.builtin.pip:
    name: /tmp/labgrid
    state: forcereinstall
    virtualenv: /opt/labgrid-venv

- name: Clean up /tmp/labgrid on RPi
  ansible.builtin.file:
    path: /tmp/labgrid
    state: absent

- name: Add user pi to hardware access groups
  become: true
  ansible.builtin.user:
    name: pi
    groups:
      - dialout
      - plugdev
      - spi
      - i2c
      - gpio
      - disk
    append: true

- name: Reload systemd daemon
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
