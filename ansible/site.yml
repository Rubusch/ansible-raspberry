---
- name: Raspberry Provisioning
  hosts: labgrid_exporters
  become: 'no'
  tasks:
    - name: Common RPI
      ansible.builtin.import_role:
        name: common-rpi64
      tags: common

    - name: Labgrid
      ansible.builtin.import_role:
        name: mod-labgrid
      tags: labgrid

    - name: USB-SD Mux
      ansible.builtin.import_role:
        name: mod-usbsdmux
      tags: usbsdmux

