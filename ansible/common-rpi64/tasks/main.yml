---
# tasks file for rpi
- name: Fix login
  become: 'yes'
  ansible.builtin.command: raspi-config nonint do_boot_behaviour B2

- name: Fix /usr/local permissions
  become: 'yes'
  ansible.builtin.file:
    path: /usr/local
    state: directory
    recurse: yes
    owner: pi
    group: pi

- name: Expand rootfs
  become: 'yes'
  ansible.builtin.command: raspi-config --expand-rootfs

- name: Copy pi configs
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: pi
    group: pi
    mode: 0644
  with_items:
    - { src: home/pi/bashrc, dest: /home/pi/.bashrc }
    - { src: home/pi/vimrc, dest: /home/pi/.vimrc }

  ## actually, for python prefer virtualenv to force linking .local (dirty hack)
- name: Symlink .local to /usr/local
  file:
    src: /usr/local
    dest: "{{ ansible_env.HOME }}/.local"
    owner: pi
    group: pi
    state: link

- name: Copy etc configs
  become: 'yes'
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: 0755
  with_items:
    - { src: etc/apt, dest: /etc/apt }
    - { src: etc/motion, dest: /etc/motion }
    - { src: etc/screenrc, dest: /etc/screenrc }
    - { src: etc/sudoers, dest: /etc/sudoers }
    - { src: usr/share/polkit-1, dest: /usr/share/polkit-1 }

- name: Reboot
  become: 'yes'
  ansible.builtin.reboot:

- name: Fix NetworkManager file permissions
  become: yes
  ansible.builtin.file:
    path: "/etc/NetworkManager/system-connections/{{ item }}"
    owner: root
    group: root
    mode: '0600'
  with_items:
    - "eth0.nmconnection"
    - "eth0.{{ vlan_id}}.nmconnection"
    - "wlan0.nmconnection"
  ignore_errors: yes

- name: Ensure WiFi is not hardware blocked
  become: yes
  ansible.builtin.command: rfkill unblock wifi
  changed_when: false

- name: Force NetworkManager to reload files from disk
  become: yes
  ansible.builtin.command: nmcli connection reload

- name: Ensure wifi is powered on
  become: yes
  ansible.builtin.command: nmcli radio wifi on

- name: Activate wlan0 connection
  become: yes
  ansible.builtin.command: nmcli connection up wlan0

- name: Fix locales
  become: 'yes'
  become_flags: '-H -S -n'
  block:
    - name: rpi/locales - Install locales
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
        name: locales

    - name: Ensure localisation files for '{{ config_system_locale }}' are available
      locale_gen:
        name: "{{ config_system_locale }}"
        state: present

    - name: Ensure localisation files for '{{ config_system_language }}' are available
      locale_gen:
        name: "{{ config_system_language }}"
        state: present

    - name: Configure system locale (Debian/RPi way)
      copy:
        dest: /etc/default/locale
        content: |
          LANG={{ config_system_locale }}
          LANGUAGE={{ config_system_language }}
          LC_ALL={{ config_system_locale }}

    - name: Reconfigure locales non-interactively
      command: dpkg-reconfigure -f noninteractive locales

    - name: Reboot
      ansible.builtin.reboot:

- name: Bring up WLAN for updates
  become: yes
  block:
    - name: Unblock WiFi radio
      ansible.builtin.command: rfkill unblock wifi

    - name: Start wlan0 connection
      community.general.nmcli:
        conn_name: wlan0
        state: up

- name: Update apt packages
  become: 'yes'
  ansible.builtin.apt:
    update_cache: 'yes'
    cache_valid_time: 86400 # one day

- name: Install package list
  become: 'yes'
  ansible.builtin.apt:
    pkg: "{{ packages }}"
    state: latest

- name: Reboot
  become: 'yes'
  ansible.builtin.reboot:

- name: Bring up WLAN for updates
  become: yes
  block:
    - name: Unblock WiFi radio
      ansible.builtin.command: rfkill unblock wifi

    - name: Start wlan0 connection
      community.general.nmcli:
        conn_name: wlan0
        state: up

- name: Enable ssh
  become: 'yes'
  systemd:
    name: ssh.service
    enabled: true
    masked: no

- name: fix timezone to Europe/Zurich
  become: 'yes'
  shell: |
    mv /etc/localtime /etc/localtime-wtf
    ln -s /usr/share/zoneinfo/Europe/Zurich /etc/localtime

- name: Autoclean package list
  become: 'yes'
  ansible.builtin.apt:
    autoclean: yes

- name: Autoremove dependencies no longer required
  become: 'yes'
  ansible.builtin.apt:
    autoremove: yes

- name: Reboot
  become: 'yes'
  ansible.builtin.reboot:

- name: Bring up WLAN for updates
  become: yes
  block:
    - name: Unblock WiFi radio
      ansible.builtin.command: rfkill unblock wifi

    - name: Start wlan0 connection
      community.general.nmcli:
        conn_name: wlan0
        state: up

- name: Enable ssh
  become: 'yes'
  systemd:
    name: ssh.service
    enabled: true
    masked: no

- name: All done!
  debug:
    msg: Packages have been successfully installed
