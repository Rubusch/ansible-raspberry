---
config_system_locale: 'en_US.UTF-8'
config_system_language: 'en_US.UTF-8'

basic_packages:
  - parted
  - e2fsprogs

common_packages:
  - vim
  - htop
  - tree
  - screen
  - tio
  - mosh
  - curl
  - wget
  - rsync
  - git
  - unzip
  - bzip2
  - zstd
  - patch
  - xxd
  - dos2unix
  - colordiff

  # Hardware, USB, Serial & Embedded Tools
  - udev
  - gpiod
  - i2c-tools
  - libftdi1-dev
  - u-boot-tools
  - device-tree-compiler
  - bmaptool
  - hdparm
  - kmod

  # Networking & File Transfer (for target booting/flashing)
  - tcpdump
  - nmap
  - iperf3
  - tftp-hpa
  - tftpd-hpa
  - sshfs

  # Minimal Python & C build tools (for building wheels in venv)
  - python3
  - python3-dev
  - python3-pip
  - python3-venv
  - build-essential
  - pkg-config
  - libffi-dev
  - libssl-dev
